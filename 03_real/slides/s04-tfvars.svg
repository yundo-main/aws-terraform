<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="변수 값 주입 방법과 우선순위">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">값 주입 방법</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">같은 코드, 다른 환경 — 변수 전달 우선순위</text>
<rect x="60" y="170" width="1160" height="380" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="204" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">1. -var 옵션</text><text x="320" y="204" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">terraform apply -var='db_password=xxx'</text><text x="320" y="234" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">최우선 — 빠른 테스트용</text><text x="90" y="276" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">2. -var-file</text><text x="320" y="276" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">terraform apply -var-file=dev.tfvars</text><text x="320" y="306" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">환경별 파일 — dev.tfvars / prod.tfvars</text><text x="90" y="348" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">3. terraform.tfvars</text><text x="320" y="348" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">자동 로드되는 기본 파일</text><text x="320" y="378" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">커밋 가능한 기본값 (비밀 금지)</text><text x="90" y="420" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">4. 환경변수</text><text x="320" y="420" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">export TF_VAR_db_password=xxx</text><text x="320" y="450" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">CI/CD 파이프라인에서 주입</text><text x="90" y="492" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">5. default 값</text><text x="320" y="492" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">variables.tf 안의 default</text><text x="320" y="522" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">위 방법 모두 없을 때</text><rect x="60" y="580" width="1160" height="60" rx="10" fill="#e6f1fa"/><text x="640" y="617" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">03_real은 db_password를 필수 입력으로 선언 — -var 없이 apply하면 입력 프롬프트가 뜬다</text>  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 03 · 실전 표준</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">04</text>
</svg>