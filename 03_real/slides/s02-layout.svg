<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="표준 레이아웃 파일 구성">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">표준 레이아웃</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">역할별로 파일을 나누는 실무 관례 — terraform은 어떤 파일명이든 합쳐서 읽는다</text>
<rect x="60" y="170" width="1160" height="400" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="212" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">파일</text><text x="380" y="212" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">역할</text><text x="700" y="212" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">왜 나누는가</text><text x="90" y="244" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" font-weight="600" fill="#1769aa" xml:space="preserve" style="white-space:pre">versions.tf</text><text x="380" y="244" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">코어·provider 버전 고정</text><text x="700" y="244" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">재현성 — 환경마다 다른 버전 방지</text><line x1="80" y1="282" x2="1200" y2="282" stroke="#e2e8f0"/><text x="90" y="310" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" font-weight="600" fill="#1769aa" xml:space="preserve" style="white-space:pre">providers.tf</text><text x="380" y="310" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">리전·인증·default_tags</text><text x="700" y="310" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">공통 태그를 한 곳에서 관리</text><line x1="80" y1="348" x2="1200" y2="348" stroke="#e2e8f0"/><text x="90" y="376" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" font-weight="600" fill="#1769aa" xml:space="preserve" style="white-space:pre">variables.tf</text><text x="380" y="376" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">입력 변수 선언</text><text x="700" y="376" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">하드코딩 제거 — 환경별 값 분리</text><line x1="80" y1="414" x2="1200" y2="414" stroke="#e2e8f0"/><text x="90" y="442" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" font-weight="600" fill="#1769aa" xml:space="preserve" style="white-space:pre">main.tf</text><text x="380" y="442" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">리소스 선언</text><text x="700" y="442" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">실제 만들 인프라 전체</text><line x1="80" y1="480" x2="1200" y2="480" stroke="#e2e8f0"/><text x="90" y="508" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" font-weight="600" fill="#1769aa" xml:space="preserve" style="white-space:pre">outputs.tf</text><text x="380" y="508" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">출력 값</text><text x="700" y="508" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">apply 결과·다른 코드에서 참조할 값</text><rect x="60" y="600" width="1160" height="60" rx="10" fill="#e6f1fa"/><text x="640" y="637" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">파일 분리는 순서가 아니라 역할 구분이다 — terraform은 전부 합쳐 하나의 설정으로 본다</text>  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 03 · 실전 표준</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">02</text>
</svg>