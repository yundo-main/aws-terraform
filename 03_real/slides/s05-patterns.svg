<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="default_tags와 dynamic 블록 패턴">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">실전 패턴</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">default_tags + dynamic 블록 — 반복을 없애는 두 가지</text>
<rect x="60" y="170" width="565" height="380" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="92" y="212" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">default_tags (providers.tf)</text><text x="92" y="258" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">provider "aws" {</text><text x="112" y="288" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">region = var.aws_region</text><text x="112" y="318" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">default_tags {</text><text x="132" y="348" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">tags = {</text><text x="152" y="378" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#1769aa" xml:space="preserve" style="white-space:pre">Project = "aws-tf"</text><text x="152" y="408" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#1769aa" xml:space="preserve" style="white-space:pre">Managed = "terraform"</text><text x="92" y="448" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">} } }</text><text x="92" y="500" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">모든 리소스에 공통 태그 자동 부착</text><text x="92" y="530" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">→ 비용 추적·소유자 식별에 필수</text><rect x="655" y="170" width="565" height="380" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="687" y="212" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">dynamic 블록 (main.tf)</text><text x="687" y="258" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">dynamic "parameter" {</text><text x="707" y="288" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">for_each = var.db_parameters</text><text x="707" y="318" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">content {</text><text x="727" y="348" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#1769aa" xml:space="preserve" style="white-space:pre">name  = parameter.value.name</text><text x="727" y="378" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#1769aa" xml:space="preserve" style="white-space:pre">value = parameter.value.value</text><text x="707" y="408" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">}</text><text x="687" y="438" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">}</text><text x="687" y="500" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">원본 8번 반복 선언 → 목록 변수 + dynamic 1회</text><text x="687" y="530" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">→ 파라미터 추가는 변수만 고치면 됨</text><rect x="60" y="580" width="1160" height="60" rx="10" fill="#e6f1fa"/><text x="640" y="617" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">origin/ 원본과 비교하면 어디가 줄고 왜 줄었는지가 보인다</text>  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 03 · 실전 표준</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">05</text>
</svg>