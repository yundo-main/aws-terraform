<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="state 분리와 단일 state 비교">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">02_practice vs 03_real</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">같은 인프라, 다른 구조 — 목적이 다르면 구조도 달라진다</text>
<rect x="60" y="170" width="565" height="380" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="92" y="212" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">02_practice — 단계 분리</text><text x="92" y="262" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· stepN/ 디렉터리별 독립 state</text><text x="92" y="308" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· remote_state로 앞 단계 출력 참조</text><text x="92" y="354" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· 계층별 apply/destroy 분리</text><text x="92" y="400" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· 값은 하드코딩 — 학습 가독성</text><text x="92" y="446" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· 강의용: 단계를 쌓아가는 경험</text><rect x="655" y="170" width="565" height="380" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="687" y="212" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">03_real — 단일 프로젝트</text><text x="687" y="262" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· main.tf 하나의 단일 state</text><text x="687" y="308" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· 리소스 직접 참조 (aws_vpc.xxx.id)</text><text x="687" y="354" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· 전체 한 번에 apply/destroy</text><text x="687" y="400" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· 값은 변수화 — 환경 재사용</text><text x="687" y="446" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· 실무용: 표준 레이아웃·모듈화</text><rect x="60" y="580" width="1160" height="60" rx="10" fill="#e6f1fa"/><text x="640" y="617" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">실무는 둘을 조합한다 — 계층별 state 분리 + 각 계층 내부는 변수·모듈화</text>  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 03 · 실전 표준</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">06</text>
</svg>