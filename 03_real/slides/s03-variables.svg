<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="variable 선언과 참조">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">변수화</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">하드코딩된 값을 variable로 뽑고 var.xxx로 참조 — 코드는 그대로, 값만 바꾼다</text>
<rect x="60" y="170" width="565" height="300" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="92" y="212" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">선언 (variables.tf)</text><text x="92" y="258" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">variable "vpc_cidr" {</text><text x="112" y="290" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">type    = string</text><text x="112" y="322" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">default = "10.200.0.0/16"</text><text x="92" y="354" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">}</text><text x="92" y="400" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">variable "db_password" {</text><text x="112" y="432" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#b86e00" xml:space="preserve" style="white-space:pre">sensitive = true</text><text x="92" y="464" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">}</text><rect x="655" y="170" width="565" height="300" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="687" y="212" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">참조 (main.tf)</text><text x="687" y="258" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">resource "aws_vpc" "terraform_vpc" {</text><text x="707" y="290" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#1769aa" xml:space="preserve" style="white-space:pre">cidr_block = var.vpc_cidr</text><text x="687" y="322" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">}</text><text x="687" y="368" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#b86e00" xml:space="preserve" style="white-space:pre">password = var.db_password</text><text x="687" y="412" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">sensitive = true → plan·apply 출력에서</text><text x="687" y="444" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">값이 (sensitive value)로 가려진다</text><rect x="60" y="500" width="1160" height="120" rx="10" fill="#fdf6ec" stroke="#b86e00" stroke-width="2"/><text x="92" y="548" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">핵심: sensitive 변수는 코드에 값이 없다</text><text x="92" y="584" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">apply 시 -var 또는 tfvars로 주입 — 비밀번호를 커밋 대상에서 완전히 제거</text>  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 03 · 실전 표준</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">03</text>
</svg>