<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="step1 네트워크 구성도">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/></marker>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker></defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
<text x="60" y="90" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">도메인 위임 — Terraform 밖의 수동 1단계</text><text x="60" y="134" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">호스팅 존 생성 ≠ 도메인 등록 — 등록기관에 NS를 직접 넣어야 app.&lt;도메인&gt;이 열린다</text><rect x="60" y="165" width="570" height="300" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">1. NS 값 확인 (Terraform)</text><text x="90" y="250" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">terraform output route53_name_servers</text><text x="90" y="290" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">→ 존 전용 NS 4개 출력</text><text x="90" y="320" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">   ns-1234.awsdns-56.org 등</text><text x="90" y="365" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">2. 등록기관에 수동 등록</text><text x="90" y="405" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">도메인을 산 곳에서 네임서버 변경</text><text x="90" y="435" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">가비아·후이즈 → 도메인 관리 → NS 변경</text><rect x="660" y="165" width="560" height="300" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="690" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">왜 필요한가</text><text x="690" y="250" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">등록기관 = 도메인 소유권</text><text x="690" y="280" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">호스팅 존 = DNS 데이터베이스</text><text x="690" y="320" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">존은 만들어져도, 등록기관이</text><text x="690" y="350" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">'Route53에 물어봐라'고 안내해야</text><text x="690" y="380" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">인터넷이 존을 찾아옴</text><text x="690" y="425" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">존 재생성 시 NS도 새 주소 — 재등록 필요</text><rect x="60" y="495" width="1160" height="90" rx="10" fill="#122033" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="533" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">3. 위임 확인</text><text x="90" y="565" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#a7f3d0" xml:space="preserve" style="white-space:pre">nslookup app.jarrod.site   # ALB DNS가 나오면 위임 완료</text><rect x="60" y="615" width="1160" height="55" rx="10" fill="#fdf2e9" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="648" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">위임 전에 04_https를 apply하면 ACM 검증이 무한 대기 — 레코드는 있지만 존에 도달 불가</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 03 · 실전</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">07</text>
</svg>