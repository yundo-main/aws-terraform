ily="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">docker build → ECR push</text><text x="487" y="336" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">tag = 커밋 해시</text><line x1="620" y1="280" x2="650" y2="280" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="650" y="190" width="265" height="180" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="782" y="238" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">Deploy</text><text x="782" y="275" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">CodeBuild</text><text x="782" y="310" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">kubectl apply + set image</text><line x1="915" y1="280" x2="945" y2="280" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="945" y="190" width="265" height="180" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="1077" y="238" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">Serve</text><text x="1077" y="275" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">EKS 노드그룹</text><text x="1077" y="310" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">pod 2개 + Service</text><rect x="60" y="420" width="565" height="140" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="92" y="462" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">imageDetail.json</text><text x="92" y="500" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">빌드가 쓴 이미지 URI를 배포가 읽는 artifact</text><text x="92" y="530" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">{"image": "xxx.dkr.ecr.../app:abc12345"}</text><rect x="655" y="420" width="565" height="140" rx="10" fill="#fdf6ec" stroke="#b86e00" stroke-width="2"/><text x="687" y="462" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">전제 조건</text><text x="687" y="500" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">EKS 클러스터 + aws-auth에 CodeBuild 역할 등록</text><text x="687" y="530" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">없으면 deploy 단계에서 kubectl 인증 실패</text><rect x="60" y="590" width="1160" height="60" rx="10" fill="#e6f1fa"/><text x="640" y="627" 