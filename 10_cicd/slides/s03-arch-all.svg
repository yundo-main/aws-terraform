pple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">03_real 인프라</text><text x="680" y="262" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">VPC·EKS·RDS·ALB</text><text x="680" y="288" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">S3 backend로 state 저장</text><line x1="330" y1="330" x2="290" y2="330" stroke="#b86e00" stroke-width="2" marker-end="url(#arw)"/><text x="285" y="352" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" font-weight="400" fill="#b86e00" xml:space="preserve" style="white-space:pre">state·artifact 참조</text><text x="60" y="410" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">② 앱 파이프라인 — 앱 push → 이미지 → EKS</text><rect x="60" y="430" width="220" height="130" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="80" y="462" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">11_app_pipeline</text><text x="80" y="490" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">ECR · dev 브랜치</text><text x="80" y="516" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="600" fill="#b86e00" xml:space="prese