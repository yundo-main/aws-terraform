<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="CI/CD 파이프라인 흐름도">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/></marker>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker></defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
<text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">파이프라인 흐름</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">push가 트리거 — plan과 apply 사이에 사람이 끼어든다</text>
<rect x="60" y="190" width="265" height="160" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="192" y="238" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">git push</text><text x="192" y="275" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">CodeCommit</text><text x="192" y="310" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">소스 저장 — EventBridge가 감지</text><line x1="325" y1="270" x2="355" y2="270" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="355" y="190" width="265" height="160" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="487" y="238" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">Plan</text><text x="487" y="275" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">CodeBuild</text><text x="487" y="310" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">init → validate → plan -out=tfplan</text><line x1="620" y1="270" x2="650" y2="270" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="650" y="190" width="265" height="160" rx="10" fill="#fdf6ec" stroke="#b86e00" stroke-width="2"/><text x="782" y="238" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">Approve</text><text x="782" y="275" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">수동 승인</text><text x="782" y="310" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">plan 로그 확인 후 버튼</text><line x1="915" y1="270" x2="945" y2="270" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="945" y="190" width="265" height="160" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="1077" y="238" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">Apply</text><text x="1077" y="275" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">CodeBuild</text><text x="1077" y="310" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">tfplan 파일 그대로 적용</text><rect x="60" y="400" width="565" height="150" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="92" y="442" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">artifact 흐름</text><text x="92" y="482" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">source_out → plan_out(리포+tfplan) → apply</text><text x="92" y="514" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">파이프라인이 S3 artifact 버킷을 경유해 전달</text><rect x="655" y="400" width="565" height="150" rx="10" fill="#fdf6ec" stroke="#b86e00" stroke-width="2"/><text x="687" y="442" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">왜 승인을 두는가</text><text x="687" y="482" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">plan 출력 = 실제 바뀔 내용 — 검토 없이</text><text x="687" y="514" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">apply하면 코드 실수가 인프라 파괴로 직행</text><rect x="60" y="580" width="1160" height="60" rx="10" fill="#e6f1fa"/><text x="640" y="617" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">전부 AWS 서비스 — GitHub·Jenkins 없이 CI/CD가 완성된다</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 10 · CI/CD</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">07</text>
</svg>