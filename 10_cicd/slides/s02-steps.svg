-space:pre">CodeBuild·Pipeline 역할을 중복 생성 안 하고</text><text x="687" y="524" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">outputs로 11에 전달 — 역할은 하나뿐</text><rect x="60" y="590" width="1160" height="60" rx="10" fill="#e6f1fa"/><text x="640" y="627" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">apply는 10→11→(12) 순서, destroy는 역순 — tfstate 버킷은 prevent_destroy 보호</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 10 · CI/CD</text>
