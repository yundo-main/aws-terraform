<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="step1 저장소 구성도">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/></marker>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker></defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
<text x="60" y="90" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">파이프라인 흐름 — 각 단계가 하는 일</text><text x="60" y="134" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">push → 계획 → 사람 승인 → 적용 — GitOps의 최소 형태</text><rect x="60" y="165" width="280" height="150" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="78" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">git push → CodeCommit</text><text x="78" y="232" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">소스 저장소 + EventBridge 트리거</text><text x="78" y="262" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="1" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre"> </text><line x1="340" y1="240" x2="358" y2="240" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="360" y="165" width="280" height="150" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="378" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">Plan — CodeBuild</text><text x="378" y="232" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">init → validate → plan -out=tfplan</text><text x="378" y="262" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="1" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre"> </text><line x1="640" y1="240" x2="658" y2="240" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="660" y="165" width="280" height="150" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="678" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">Approve — 수동 승인</text><text x="678" y="232" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">사람이 plan 로그를 읽고 버튼</text><text x="678" y="262" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="1" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre"> </text><line x1="940" y1="240" x2="958" y2="240" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="960" y="165" width="280" height="150" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="978" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">Apply — CodeBuild</text><text x="978" y="232" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">전달받은 tfplan을 적용</text><text x="978" y="262" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="1" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre"> </text><rect x="60" y="340" width="1160" height="120" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="378" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">artifact가 '검토한 것 = 적용한 것'을 보장</text><text x="90" y="412" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">source_out(리포) → plan_out(리포+tfplan) → apply — 파이프라인이 S3 artifact 버킷을 경유해</text><text x="90" y="440" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">파일을 넘긴다. apply가 plan을 다시 돌리지 않는 게 포인트 — 승인과 실행 사이의 drift 차단</text><rect x="60" y="490" width="1160" height="95" rx="10" fill="#fdf2e9" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="528" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">왜 승인을 두는가 — plan 출력 = 실제 바뀔 내용</text><text x="90" y="560" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">검토 없이 apply하면 코드 실수(오타·잘못된 참조)가 인프라 파괴로 직행 — 승인이 유일한 안전장치</text><rect x="60" y="605" width="1160" height="60" rx="10" fill="#e6f1fa" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="640" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">전부 AWS 서비스 — GitHub·Jenkins 없이 push → 승인 → 배포 CI/CD가 완성된다</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 10 · CI/CD</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">09</text>
</svg>