<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="생각해보기 정답과 해설">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>

  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">정답</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">생각해보기 세 질문의 답과 해설</text>

  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="60" y="180" width="1160" height="130" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <rect x="60" y="180" width="6" height="130" rx="3" fill="#1a7f4b"/>
    <text x="92" y="218" font-size="19" font-weight="700" fill="#1a7f4b" xml:space="preserve" style="white-space:pre">1. 코어와 프로바이더의 역할 차이</text>
    <text x="92" y="254" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">코어는 HCL 해석·계획·상태 관리(무엇을 바꿀지), 프로바이더는 API 호출(어떻게 호출할지)</text>
    <text x="92" y="288" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">→ 코어는 플랫폼을 몰라도 되고, 플랫폼별 지식은 전부 프로바이더에 있다</text>

    <rect x="60" y="330" width="1160" height="130" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <rect x="60" y="330" width="6" height="130" rx="3" fill="#1a7f4b"/>
    <text x="92" y="368" font-size="19" font-weight="700" fill="#1a7f4b" xml:space="preserve" style="white-space:pre">2. "hashicorp/aws"의 구성</text>
    <text x="92" y="404" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">네임스페이스(hashicorp) / 프로바이더 이름(aws) — registry.terraform.io의 주소</text>
    <text x="92" y="438" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">→ 서드파티 프로바이더도 같은 형식: datadog/datadog, integrations/github 등</text>

    <rect x="60" y="480" width="1160" height="130" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <rect x="60" y="480" width="6" height="130" rx="3" fill="#1a7f4b"/>
    <text x="92" y="518" font-size="19" font-weight="700" fill="#1a7f4b" xml:space="preserve" style="white-space:pre">3. "~&gt; 5.0"의 범위</text>
    <text x="92" y="554" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">5.0 이상 ~ 6.0 미만 — 5.x 계열의 마이너·패치 업데이트만 허용</text>
    <text x="92" y="588" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">→ 메이저 업그레이드(6.0)로 인한 호환성 깨짐을 막는다</text>
  </g>

  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 01 · Provider</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">11</text>
</svg>
