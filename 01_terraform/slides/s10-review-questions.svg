<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="생각해보기: Provider 복습 질문 세 개">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>

  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">생각해보기</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">이번 단계 내용을 스스로 점검해 보는 질문</text>

  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="60" y="180" width="1160" height="120" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <circle cx="112" cy="240" r="22" fill="#1769aa"/>
    <text x="112" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">1</text>
    <text x="160" y="248" font-size="21" fill="#122033" xml:space="preserve" style="white-space:pre">Terraform 코어와 프로바이더의 역할 차이는 무엇인가?</text>

    <rect x="60" y="330" width="1160" height="120" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <circle cx="112" cy="390" r="22" fill="#1769aa"/>
    <text x="112" y="398" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">2</text>
    <text x="160" y="390" font-size="21" fill="#122033" xml:space="preserve" style="white-space:pre">source = "hashicorp/aws" 에서 앞부분과 뒷부분은 각각 무엇인가?</text>
    <text x="160" y="426" font-size="17" fill="#516174" xml:space="preserve" style="white-space:pre">힌트: 레지스트리의 주소 체계를 생각해 보자</text>

    <rect x="60" y="480" width="1160" height="120" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <circle cx="112" cy="540" r="22" fill="#1769aa"/>
    <text x="112" y="548" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">3</text>
    <text x="160" y="540" font-size="21" fill="#122033" xml:space="preserve" style="white-space:pre">version = "~&gt; 5.0" 일 때 설치될 수 있는 버전 범위는?</text>
    <text x="160" y="576" font-size="17" fill="#516174" xml:space="preserve" style="white-space:pre">힌트: 마지막 숫자만 증가할 수 있다</text>
  </g>

  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 01 · Provider</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">10</text>
</svg>
