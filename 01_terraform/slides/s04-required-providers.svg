    <rect x="760" y="330" width="460" height="140" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <text x="792" y="370" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="18" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">version</text>
