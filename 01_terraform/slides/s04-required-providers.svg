    <text x="792" y="440" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">재현성을 위해 항상 명시 권장</text>

    <rect x="760" y="490" width="460" height="120" rx="10" fill="#e6f1fa"/>
    <text x="792" y="528" font-size="18" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">로컬 이름은 자유</text>
    <text x="792" y="562" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">aws = { … } 의 "aws"가 코드에서 쓰는 이름</text>
    <text x="792" y="592" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">→ aws_instance, aws_vpc 등의 접두어</text>
  </g>

  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 01 · Provider</text>
