D Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">3. plan</text><text x="639" y="275" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">변경 계획 미리보기</text><text x="639" y="305" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">실행 전 검증 — 무엇이 바뀌나</text><line x1="742" y1="265" x2="774" y2="265" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="774" y="190" width="206" height="150" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="877" y="238" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">4. apply</text><text x="877" y="275" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">실제 리소스 생성</text><text x="877" y="305" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">API 호출 → state에 기록</text><line x1="980" y1="265" x2="1012" y2="265" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="1012" y="190" width="206" height="150" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="1115" y="238" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">5. destroy</text><text x="1115" y="275" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">리소스 삭제</text><text x="1115" y="305" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">state 읽고 전부 제거</text><rect x="60" y="380" width="1160" height="110" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="92" y="422" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">state가 중심</text><text x="92" y="462" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">apply가 만든 실제 리소스를 terraform.tfstate에 기록 — plan은 state↔코드 비교, destroy는 state 목록으로 삭제</text><rect x="60" y="510" width="1160" height="100" rx="10" fill="#122033" stroke="#c9d5e1" stroke-width="1"/><text x="92" y="552" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="19" font-weight="400" fill="#ffffff" xml:space="preserve" style="white-space:pre">cd 01_terraform</text><text x="92" y="590" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="19" font-weight="400" fill="#7fd1a8" xml:space="preserve" style="white-space:pre">terraform init → plan → apply → destroy</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 01 · Provider</text>
