2" y="380" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="18" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">resource</text><text x="300" y="380" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">resource "aws_vpc" "main" { }</text><text x="700" y="380" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">실제로 만들 것 — 대부분이 이것</text><line x1="80" y1="393" x2="1200" y2="393" stroke="#e2e8f0"/><text x="92" y="416" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="18" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">provider</text><text x="300" y="416" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">provider "aws" { }</text><text x="700" y="416" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">어디에 만들지 — 리전·인증</text><line x1="80" y1="429" x2="1200" y2="429" stroke="#e2e8f0"/><text x="92" y="452" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="18" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">variable</text><text x="300" y="452" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">variable "name" { }</text><text x="700" y="452" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">바깥에서 받는 입력값</text><line x1="80" y1="465" x2="1200" y2="465" stroke="#e2e8f0"/><text x="92" y="488" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="18" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">output</text><text x="300" y="488" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">output "id" { }</text><text x="700" y="488" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">apply 후 내보내는 값</text><line x1="80" y1="501" x2="1200" y2="501" stroke="#e2e8f0"/><text x="92" y="524" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="18" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">data</text><text x="300" y="524" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">data "aws_ami" "x" { }</text><text x="700" y="524" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">만들지 않고 기존 것을 읽음</text><rect x="60" y="580" width="1160" height="70" rx="10" fill="#e6f1fa" stroke="#c9d5e1" stroke-width="1"/><text x="92" y="618" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">참조 = 라벨 연결 — </text><text x="340" y="618" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">aws_vpc.main.id  →  &lt;타입&gt;.&lt;라벨&gt;.&lt;속성&gt; 형태로 다른 블록 값을 가져온다</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 01 · Provider</text>
