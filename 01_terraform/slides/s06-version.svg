<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="버전 제약 연산자와 pessimistic constraint 설명">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>

  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">버전 제약 (Version Constraints)</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">어떤 프로바이더 버전을 허용할지 범위로 지정한다</text>

  <!-- 연산자 표 -->
  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="60" y="170" width="560" height="46" fill="#122033"/>
    <text x="160" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">연산자</text>
    <text x="410" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">의미</text>

    <rect x="60" y="216" width="560" height="56" fill="#ffffff"/>
    <text x="160" y="250" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="19" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">= 5.40.0</text>
    <text x="410" y="250" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">정확히 이 버전만</text>

    <rect x="60" y="272" width="560" height="56" fill="#eef1f4"/>
    <text x="160" y="306" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="19" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">&gt;= 5.0</text>
    <text x="410" y="306" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">5.0 이상 모두</text>

    <rect x="60" y="328" width="560" height="56" fill="#ffffff"/>
    <text x="160" y="362" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="19" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">!= 5.41.0</text>
    <text x="410" y="362" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">이 버전만 제외</text>

    <rect x="60" y="384" width="560" height="56" fill="#eef1f4"/>
    <text x="160" y="418" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="19" font-weight="700" fill="#1a7f4b" xml:space="preserve" style="white-space:pre">~&gt; 5.0</text>
    <text x="410" y="418" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">5.x만 허용 (6.0 미만)</text>

    <rect x="60" y="170" width="560" height="270" fill="none" stroke="#c9d5e1"/>
    <line x1="260" y1="170" x2="260" y2="440" stroke="#c9d5e1"/>
  </g>

  <!-- ~> 5.0 범위 도식 -->
  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="660" y="170" width="560" height="270" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <text x="692" y="212" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">"~&gt; 5.0"이 허용하는 범위</text>

    <!-- 허용 구간 막대 -->
    <rect x="692" y="250" width="360" height="40" rx="6" fill="#e6f1fa"/>
    <text x="872" y="276" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" fill="#1a7f4b" xml:space="preserve" style="white-space:pre">5.0 ~ 5.x 허용</text>
    <rect x="1052" y="250" width="140" height="40" rx="6" fill="#f5e2dd"/>
    <text x="1122" y="276" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" fill="#c0392b" xml:space="preserve" style="white-space:pre">6.0 차단</text>

    <text x="692" y="340" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">마지막 숫자만 올라간다 —</text>
    <text x="692" y="372" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">호환되는 마이너·패치 업데이트만 허용</text>
    <text x="692" y="412" font-size="15" fill="#516174" xml:space="preserve" style="white-space:pre">~&gt; 5.1.0 이면 5.1.x만 허용 (5.2 차단)</text>
  </g>

  <!-- 왜 고정하는가 -->
  <rect x="60" y="480" width="1160" height="120" rx="10" fill="#e6f1fa"/>
  <text x="92" y="522" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">왜 버전을 고정하는가</text>
  <text x="92" y="560" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">팀원·CI·운영 환경이 같은 프로바이더 버전으로 동작해야 plan 결과가 같다 —</text>
  <text x="92" y="590" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">.terraform.lock.hcl 이 실제 선택된 버전 해시를 잠가 둔다</text>

  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 01 · Provider</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">06</text>
</svg>
