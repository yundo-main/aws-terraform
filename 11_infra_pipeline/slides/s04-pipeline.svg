<rect x="60" y="170" width="565" height="330" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="92" y="212" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">만드는 리소스 (8개)</text><text x="92" y="258" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· GitHub 연결 — CodeConnections</text><text x="92" y="304" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· CodeBuild 역할 (admin — 학습용)</text><text x="92" y="350" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· CodeBuild plan / apply ×2</text><text x="92" y="396" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· Pipeline 역할 + 정책</text><text x="92" y="442" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· CodePipeline 4단계</text><rect x="655" y="170" width="565" height="330" rx="10" fill="#fdf6ec" stroke="#b86e00" stroke-width="2"/><text x="687" y="212" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">10_backend 연결</text><text x="687" y="258" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· local.artifacts_bucket — remote_state 참조</text><text x="687" y="304" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· buildspec 경로 = 리포 안 위치와 일치 필요</text><text x="687" y="350" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· outputs로 공용 역할 ARN을 11에 전달</text><text x="687" y="396" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">· plan_out(tfplan)이 승인 후 apply 입력</text><rect x="60" y="530" width="1160" height="60" rx="10" fill="#e6f1fa"/><text x="640" y="567" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">push → Source → Plan → Approve(멈춤) → Apply — 승인 전까진 인프라가 안 바뀐다</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 10 · CI/CD</text>
