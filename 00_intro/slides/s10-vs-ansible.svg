<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Ansible과 Terraform 비교 표">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>

  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">Ansible vs Terraform</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">구성 관리 도구와 프로비저닝 도구의 역할 차이</text>

  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <!-- 헤더 -->
    <rect x="60" y="160" width="1160" height="46" fill="#122033"/>
    <text x="160" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">구분</text>
    <text x="540" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">Ansible</text>
    <text x="1000" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">Terraform</text>

    <!-- 행 1 -->
    <rect x="60" y="206" width="1160" height="50" fill="#ffffff"/>
    <text x="160" y="237" text-anchor="middle" font-size="17" font-weight="600" fill="#122033" xml:space="preserve" style="white-space:pre">주 용도</text>
    <text x="540" y="237" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">구성 관리 (Configuration Mgmt)</text>
    <text x="1000" y="237" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">인프라 프로비저닝</text>

    <!-- 행 2 -->
    <rect x="60" y="256" width="1160" height="50" fill="#eef1f4"/>
    <text x="160" y="287" text-anchor="middle" font-size="17" font-weight="600" fill="#122033" xml:space="preserve" style="white-space:pre">철학</text>
    <text x="540" y="287" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">"서버 안을 어떻게 설정할 것인가"</text>
    <text x="1000" y="287" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">"인프라를 무엇으로 만들 것인가"</text>

    <!-- 행 3 -->
    <rect x="60" y="306" width="1160" height="50" fill="#ffffff"/>
    <text x="160" y="337" text-anchor="middle" font-size="17" font-weight="600" fill="#122033" xml:space="preserve" style="white-space:pre">방식</text>
    <text x="540" y="337" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">절차적 + 선언적</text>
    <text x="1000" y="337" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">선언적 (Declarative)</text>

    <!-- 행 4 -->
    <rect x="60" y="356" width="1160" height="50" fill="#eef1f4"/>
    <text x="160" y="387" text-anchor="middle" font-size="17" font-weight="600" fill="#122033" xml:space="preserve" style="white-space:pre">상태 관리</text>
    <text x="540" y="387" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">없음 (stateless)</text>
    <text x="1000" y="387" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">있음 (stateful)</text>

    <!-- 행 5 -->
    <rect x="60" y="406" width="1160" height="50" fill="#ffffff"/>
    <text x="160" y="437" text-anchor="middle" font-size="17" font-weight="600" fill="#122033" xml:space="preserve" style="white-space:pre">에이전트</text>
    <text x="540" y="437" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">불필요 (SSH 기반)</text>
    <text x="1000" y="437" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">불필요</text>

    <!-- 행 6 -->
    <rect x="60" y="456" width="1160" height="50" fill="#eef1f4"/>
    <text x="160" y="487" text-anchor="middle" font-size="17" font-weight="600" fill="#122033" xml:space="preserve" style="white-space:pre">언어</text>
    <text x="540" y="487" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">YAML (Playbook)</text>
    <text x="1000" y="487" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">HCL</text>

    <!-- 행 7 -->
    <rect x="60" y="506" width="1160" height="50" fill="#ffffff"/>
    <text x="160" y="537" text-anchor="middle" font-size="17" font-weight="600" fill="#122033" xml:space="preserve" style="white-space:pre">멱등성</text>
    <text x="540" y="537" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">있음</text>
    <text x="1000" y="537" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">있음</text>

    <!-- 행 8 -->
    <rect x="60" y="556" width="1160" height="50" fill="#eef1f4"/>
    <text x="160" y="587" text-anchor="middle" font-size="17" font-weight="600" fill="#122033" xml:space="preserve" style="white-space:pre">대표 사용처</text>
    <text x="540" y="587" text-anchor="middle" font-size="16" fill="#122033" xml:space="preserve" style="white-space:pre">패키지 설치, 설정 배포, 서비스 재시작</text>
    <text x="1000" y="587" text-anchor="middle" font-size="16" fill="#122033" xml:space="preserve" style="white-space:pre">VM, VPC, Load Balancer, DB 생성</text>

    <!-- 열 구분선 + 외곽 -->
    <line x1="260" y1="160" x2="260" y2="606" stroke="#c9d5e1"/>
    <line x1="820" y1="160" x2="820" y2="606" stroke="#c9d5e1"/>
    <rect x="60" y="160" width="1160" height="446" fill="none" stroke="#c9d5e1"/>
  </g>

  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 00 · IaC</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">10</text>
</svg>
