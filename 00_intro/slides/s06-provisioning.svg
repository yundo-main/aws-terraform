<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="프로비저닝: 필요 자원에서 실행 가능한 인프라로의 흐름">
  <defs>
    <marker id="ah1769aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>

  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">프로비저닝 (Provisioning)</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">IT 시스템에 필요한 자원을 준비·설정·할당하는 과정</text>

  <!-- 흐름 도식: 필요 자원 → 프로비저닝 → 실행 가능한 인프라 -->
  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <!-- 입력: 필요 자원 -->
    <rect x="60" y="200" width="290" height="300" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <text x="205" y="240" text-anchor="middle" font-size="20" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">필요한 자원</text>
    <rect x="85" y="262" width="240" height="44" rx="6" fill="#eef1f4"/>
    <text x="205" y="290" text-anchor="middle" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">서버</text>
    <rect x="85" y="318" width="240" height="44" rx="6" fill="#eef1f4"/>
    <text x="205" y="346" text-anchor="middle" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">네트워크</text>
    <rect x="85" y="374" width="240" height="44" rx="6" fill="#eef1f4"/>
    <text x="205" y="402" text-anchor="middle" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">데이터베이스</text>
    <rect x="85" y="430" width="240" height="44" rx="6" fill="#eef1f4"/>
    <text x="205" y="458" text-anchor="middle" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">스토리지 등</text>

    <!-- 화살표 1 -->
    <line x1="360" y1="350" x2="445" y2="350" stroke="#1769aa" stroke-width="3" marker-end="url(#ah1769aa)"/>

    <!-- 프로세스 -->
    <rect x="455" y="255" width="370" height="190" rx="10" fill="#1769aa"/>
    <text x="640" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">프로비저닝</text>
    <text x="640" y="366" text-anchor="middle" font-size="19" fill="#d8e8f5" xml:space="preserve" style="white-space:pre">준비 → 설정 → 할당</text>
    <text x="640" y="404" text-anchor="middle" font-size="16" fill="#b8d2ea" xml:space="preserve" style="white-space:pre">IaC 도구가 코드로 자동화</text>

    <!-- 화살표 2 -->
    <line x1="835" y1="350" x2="920" y2="350" stroke="#1769aa" stroke-width="3" marker-end="url(#ah1769aa)"/>

    <!-- 출력 -->
    <rect x="930" y="255" width="290" height="190" rx="10" fill="#ffffff" stroke="#1a7f4b" stroke-width="2"/>
    <text x="1075" y="330" text-anchor="middle" font-size="20" font-weight="700" fill="#1a7f4b" xml:space="preserve" style="white-space:pre">실행 가능한</text>
    <text x="1075" y="362" text-anchor="middle" font-size="20" font-weight="700" fill="#1a7f4b" xml:space="preserve" style="white-space:pre">인프라</text>
  </g>

  <rect x="60" y="540" width="1160" height="70" rx="10" fill="#e6f1fa"/>
  <text x="640" y="583" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" fill="#122033" xml:space="preserve" style="white-space:pre">수동 콘솔 작업 대신 코드로 정의하면 반복 가능하고 검토 가능한 프로비저닝이 된다</text>

  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 00 · IaC</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">06</text>
</svg>
