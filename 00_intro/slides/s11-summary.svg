<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="정리: IaC, Terraform 워크플로우, Ansible과의 역할 분담">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>

  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">정리</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">이번 단계에서 다룬 핵심</text>

  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <!-- 1 -->
    <circle cx="85" cy="195" r="18" fill="#1769aa"/>
    <text x="85" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">1</text>
    <text x="125" y="203" font-size="20" fill="#122033" xml:space="preserve" style="white-space:pre"><tspan font-weight="700">IaC</tspan> — 인프라를 코드로 관리해 재현성과 자동화를 확보</text>

    <!-- 2 -->
    <circle cx="85" cy="275" r="18" fill="#1769aa"/>
    <text x="85" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">2</text>
    <text x="125" y="283" font-size="20" fill="#122033" xml:space="preserve" style="white-space:pre"><tspan font-weight="700">Terraform</tspan> — HCL로 작성하는 선언적 IaC 도구</text>
    <text x="125" y="318" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" fill="#516174" xml:space="preserve" style="white-space:pre">init → validate → plan → apply</text>

    <!-- 3 -->
    <circle cx="85" cy="385" r="18" fill="#1769aa"/>
    <text x="85" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">3</text>
    <text x="125" y="393" font-size="20" fill="#122033" xml:space="preserve" style="white-space:pre"><tspan font-weight="700">역할 분담</tspan> — Ansible은 서버 내부 설정, Terraform은 인프라 생성</text>

    <!-- 4 -->
    <circle cx="85" cy="465" r="18" fill="#1769aa"/>
    <text x="85" y="472" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">4</text>
    <text x="125" y="473" font-size="20" fill="#122033" xml:space="preserve" style="white-space:pre">두 도구는 상호 보완적 — Terraform으로 만들고 Ansible로 설정하는 조합이 일반적</text>
  </g>

  <rect x="60" y="540" width="1160" height="80" rx="10" fill="#e6f1fa"/>
  <text x="640" y="588" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="600" fill="#1769aa" xml:space="preserve" style="white-space:pre">다음: .tf 파일로 실제 AWS 리소스를 만들어 보는 실습</text>

  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 00 · IaC</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">11</text>
</svg>
