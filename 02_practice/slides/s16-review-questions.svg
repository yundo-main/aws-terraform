<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="생각해보기: 실행 방법 복습 질문 세 개">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>

  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">생각해보기</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">실행 방법을 스스로 점검해 보는 질문</text>

  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="60" y="180" width="1160" height="120" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <circle cx="112" cy="240" r="22" fill="#1769aa"/>
    <text x="112" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">1</text>
    <text x="160" y="248" font-size="21" fill="#122033" xml:space="preserve" style="white-space:pre">terraform init을 한 번 했는데 또 실행해야 하는 경우는 언제인가?</text>

    <rect x="60" y="330" width="1160" height="120" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <circle cx="112" cy="390" r="22" fill="#1769aa"/>
    <text x="112" y="398" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">2</text>
    <text x="160" y="390" font-size="21" fill="#122033" xml:space="preserve" style="white-space:pre">plan 출력의 +, -, -/+ 기호는 각각 무슨 뜻인가?</text>
    <text x="160" y="426" font-size="17" fill="#516174" xml:space="preserve" style="white-space:pre">힌트: 색이 아니라 "변경의 종류"를 나타낸다</text>

    <rect x="60" y="480" width="1160" height="120" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <circle cx="112" cy="540" r="22" fill="#1769aa"/>
    <text x="112" y="548" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">3</text>
    <text x="160" y="540" font-size="21" fill="#122033" xml:space="preserve" style="white-space:pre">destroy는 "이 디렉터리의 .tf에 적힌 리소스"를 지우는가? 아니면 다른 기준인가?</text>
    <text x="160" y="576" font-size="17" fill="#516174" xml:space="preserve" style="white-space:pre">힌트: 콘솔에서 직접 만든 리소스는 어떻게 되는지 생각해 보자</text>
  </g>

  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 02 · AWS 실습</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">16</text>
</svg>
