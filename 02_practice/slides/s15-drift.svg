<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="step1 네트워크 구성도">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/></marker>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker></defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
<text x="60" y="90" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">드리프트 체험 — 콘솔에서 몰래 바꿔보기</text><text x="60" y="134" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">RDS를 콘솔에서 수동 삭제 → Terraform은 어떻게 알아차릴까</text><rect x="60" y="165" width="570" height="230" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">실습 순서</text><text x="90" y="245" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">1. terraform apply — RDS까지 생성</text><text x="90" y="280" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">2. 콘솔에서 RDS 인스턴스 수동 삭제</text><text x="90" y="315" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">3. terraform plan -refresh-only</text><text x="112" y="350" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">— 실제 상태와 state의 불일치만 표시</text><text x="90" y="385" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">4. plan → '밖에서 변경됨' 감지 확인</text><rect x="660" y="165" width="560" height="230" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="690" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">동기화 방법 — 시나리오별</text><text x="690" y="245" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#2e7d32" xml:space="preserve" style="white-space:pre">실수로 지움 → 복구</text><text x="960" y="245" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">terraform apply (자동 재생성)</text><text x="690" y="295" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#2e7d32" xml:space="preserve" style="white-space:pre">의도적 제거 → 관리 해제</text><text x="960" y="295" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">09-rds.tf 제거 + apply</text><text x="690" y="345" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#2e7d32" xml:space="preserve" style="white-space:pre">리소스 살리고 관리만 해제</text><text x="960" y="345" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">terraform state rm</text><rect x="60" y="425" width="1160" height="90" rx="10" fill="#fdf2e9" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="462" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">주의 — state rm은 설정에서 지우는 것과 다릅니다</text><text x="90" y="496" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">state만 지우면 설정이 남아있어 다음 apply 때 RDS를 새로 만듭니다</text><rect x="60" y="545" width="1160" height="105" rx="10" fill="#e6f1fa" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="582" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">plan은 매번 실제 인프라를 다시 조회(refresh)합니다</text><text x="90" y="616" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">콘솔에서 바꾼 것 = 코드가 아니라서 diff로 드러남 — apply로 원복하면</text><text x="90" y="640" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">'선언된 상태로 되돌린다'는 IaC의 힘을 체험하는 실습입니다</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 02 · Hands-on</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">15</text>
</svg>