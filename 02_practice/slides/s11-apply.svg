<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="terraform apply의 의존 순서와 승인 절차">
  <defs>
    <marker id="ah1769aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>

  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">3단계 — terraform apply</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">plan 결과를 실제 AWS에 적용 — 순서는 의존 그래프가 자동 결정</text>

  <!-- 명령어 + 승인 -->
  <rect x="60" y="165" width="720" height="64" rx="10" fill="#122033"/>
  <text x="92" y="206" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="22" fill="#ffffff" xml:space="preserve" style="white-space:pre">terraform apply</text>
  <rect x="800" y="165" width="420" height="64" rx="10" fill="#fdf6ec" stroke="#b86e00" stroke-width="2"/>
  <text x="1010" y="205" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">확인 프롬프트에 <tspan font-weight="700">yes</tspan> 입력</text>

  <!-- 의존 순서 도식 (층) -->
  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <text x="60" y="272" font-size="18" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">생성 순서 (참조 관계 → 자동 순서)</text>

    <!-- 층 1 -->
    <rect x="60" y="292" width="200" height="64" rx="8" fill="#1769aa"/>
    <text x="160" y="330" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">aws_vpc</text>
    <line x1="266" y1="324" x2="316" y2="324" stroke="#1769aa" stroke-width="3" marker-end="url(#ah1769aa)"/>

    <!-- 층 2 -->
    <rect x="324" y="272" width="200" height="46" rx="8" fill="#ffffff" stroke="#1769aa" stroke-width="2"/>
    <text x="424" y="301" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" fill="#1769aa" xml:space="preserve" style="white-space:pre">subnet ×4</text>
    <rect x="324" y="326" width="200" height="46" rx="8" fill="#ffffff" stroke="#1769aa" stroke-width="2"/>
    <text x="424" y="355" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" fill="#1769aa" xml:space="preserve" style="white-space:pre">internet_gateway</text>
    <line x1="530" y1="324" x2="580" y2="324" stroke="#1769aa" stroke-width="3" marker-end="url(#ah1769aa)"/>

    <!-- 층 3 -->
    <rect x="588" y="272" width="210" height="46" rx="8" fill="#ffffff" stroke="#1769aa" stroke-width="2"/>
    <text x="693" y="301" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" fill="#1769aa" xml:space="preserve" style="white-space:pre">eip → nat_gateway</text>
    <rect x="588" y="326" width="210" height="46" rx="8" fill="#ffffff" stroke="#1769aa" stroke-width="2"/>
    <text x="693" y="355" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" fill="#1769aa" xml:space="preserve" style="white-space:pre">route_table + route</text>
    <line x1="804" y1="324" x2="854" y2="324" stroke="#1769aa" stroke-width="3" marker-end="url(#ah1769aa)"/>

    <!-- 층 4 -->
    <rect x="862" y="272" width="170" height="46" rx="8" fill="#ffffff" stroke="#1769aa" stroke-width="2"/>
    <text x="947" y="301" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" fill="#1769aa" xml:space="preserve" style="white-space:pre">security_group</text>
    <rect x="862" y="326" width="170" height="46" rx="8" fill="#ffffff" stroke="#1769aa" stroke-width="2"/>
    <text x="947" y="355" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" fill="#1769aa" xml:space="preserve" style="white-space:pre">db_subnet_group</text>
    <line x1="1038" y1="324" x2="1088" y2="324" stroke="#1769aa" stroke-width="3" marker-end="url(#ah1769aa)"/>

    <!-- 층 5 -->
    <rect x="1096" y="272" width="124" height="46" rx="8" fill="#1a7f4b"/>
    <text x="1158" y="301" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">ec2</text>
    <rect x="1096" y="326" width="124" height="46" rx="8" fill="#1a7f4b"/>
    <text x="1158" y="355" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">rds</text>
  </g>

  <!-- 설명 카드 -->
  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="60" y="420" width="565" height="170" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <text x="92" y="462" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">파일 순서 ≠ 생성 순서</text>
    <text x="92" y="500" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">terraform은 리소스 간 참조(aws_vpc.id 등)로</text>
    <text x="92" y="532" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">의존 그래프를 그려 올바른 순서를 계산한다</text>
    <text x="92" y="564" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">독립된 리소스는 병렬로 생성된다</text>

    <rect x="655" y="420" width="565" height="170" rx="10" fill="#eef1f4"/>
    <text x="687" y="462" font-size="20" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">성공하면</text>
    <text x="687" y="500" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" fill="#1a7f4b" xml:space="preserve" style="white-space:pre">Apply complete! Resources: N added</text>
    <text x="687" y="536" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">terraform.tfstate 생성 — 선언한 리소스와</text>
    <text x="687" y="566" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">실제 AWS 리소스의 매핑이 기록된다</text>
  </g>

  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 02 · AWS 실습</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">11</text>
</svg>
