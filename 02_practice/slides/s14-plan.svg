<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="terraform plan 출력 기호와 검토 포인트">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>

  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">2단계 — terraform plan</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">실제 변경 전 "무엇이 만들어지고 바뀌는지" 미리보기</text>

  <!-- 명령어 -->
  <rect x="60" y="165" width="1160" height="64" rx="10" fill="#122033"/>
  <text x="92" y="206" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="22" fill="#ffffff" xml:space="preserve" style="white-space:pre">terraform plan</text>

  <!-- 기호 표 -->
  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="60" y="265" width="565" height="46" fill="#122033"/>
    <text x="140" y="295" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">기호</text>
    <text x="390" y="295" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" xml:space="preserve" style="white-space:pre">의미</text>

    <rect x="60" y="311" width="565" height="52" fill="#ffffff"/>
    <text x="140" y="344" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="20" font-weight="700" fill="#1a7f4b" xml:space="preserve" style="white-space:pre">+</text>
    <text x="390" y="344" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">새로 생성 (create)</text>

    <rect x="60" y="363" width="565" height="52" fill="#eef1f4"/>
    <text x="140" y="396" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="20" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">~</text>
    <text x="390" y="396" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">속성 변경 (update)</text>

    <rect x="60" y="415" width="565" height="52" fill="#ffffff"/>
    <text x="140" y="448" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="20" font-weight="700" fill="#c0392b" xml:space="preserve" style="white-space:pre">-</text>
    <text x="390" y="448" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">삭제 (destroy)</text>

    <rect x="60" y="467" width="565" height="52" fill="#eef1f4"/>
    <text x="140" y="500" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="20" font-weight="700" fill="#c0392b" xml:space="preserve" style="white-space:pre">-/+</text>
    <text x="390" y="500" text-anchor="middle" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">삭제 후 재생성 (replace)</text>

    <rect x="60" y="265" width="565" height="254" fill="none" stroke="#c9d5e1"/>
    <line x1="220" y1="265" x2="220" y2="519" stroke="#c9d5e1"/>
  </g>

  <!-- 오른쪽: 이 코드에서 기대할 것 -->
  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="655" y="265" width="565" height="254" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <text x="687" y="307" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">이 코드의 예상 출력</text>
    <text x="687" y="348" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">Plan: N to add, 0 to change,</text>
    <text x="687" y="380" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">      0 to destroy.</text>
    <text x="687" y="424" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">VPC·서브넷·게이트웨이·라우팅·SG·EC2·RDS</text>
    <text x="687" y="456" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">전부 "+"로 나열되는지 확인</text>
    <text x="687" y="496" font-size="16" fill="#b86e00" xml:space="preserve" style="white-space:pre">※ "declared but not referenced" 류 에러가</text>
    <text x="687" y="522" font-size="16" fill="#b86e00" xml:space="preserve" style="white-space:pre">나오면 리소스 이름 불일치 — 코드부터 수정</text>
  </g>

  <rect x="60" y="555" width="1160" height="60" rx="10" fill="#e6f1fa"/>
  <text x="640" y="592" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" fill="#122033" xml:space="preserve" style="white-space:pre">plan은 인프라를 바꾸지 않는다 — 읽기 전용. 안심하고 여러 번 돌려도 된다</text>

  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 02 · AWS 실습</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">14</text>
</svg>
