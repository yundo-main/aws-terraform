<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="terraform destroy와 비용 주의">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>

  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">4단계 — terraform destroy</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">state가 추적하는 모든 리소스를 삭제 — 실습의 마무리</text>

  <!-- 명령어 -->
  <rect x="60" y="165" width="720" height="64" rx="10" fill="#122033"/>
  <text x="92" y="206" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="22" fill="#ffffff" xml:space="preserve" style="white-space:pre">terraform destroy</text>
  <rect x="800" y="165" width="420" height="64" rx="10" fill="#fdf0ef" stroke="#c0392b" stroke-width="2"/>
  <text x="1010" y="205" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">확인 프롬프트에 <tspan font-weight="700">yes</tspan> 입력</text>

  <!-- 비용 주의 -->
  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="60" y="265" width="1160" height="130" rx="10" fill="#fdf6ec" stroke="#b86e00" stroke-width="2"/>
    <text x="92" y="308" font-size="22" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">⚠ 켜 두면 비용이 나가는 리소스</text>
    <text x="92" y="348" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">NAT 게이트웨이(시간당 과금) · EIP(미사용 시 과금) · EC2 인스턴스 · RDS 인스턴스</text>
    <text x="92" y="380" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">VPC·서브넷·라우팅 테이블·보안 그룹은 무료 — 비용은 "실행 중인 것"에서 나온다</text>
  </g>

  <!-- destroy 동작 -->
  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="60" y="425" width="565" height="180" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <text x="92" y="467" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">destroy가 지우는 범위</text>
    <text x="92" y="505" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">tfstate에 기록된 리소스만 삭제 —</text>
    <text x="92" y="537" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">콘솔에서 손으로 만든 것은 건드리지 않는다</text>
    <text x="92" y="577" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">삭제 순서도 의존 그래프가 결정 (생성의 역순)</text>

    <rect x="655" y="425" width="565" height="180" rx="10" fill="#eef1f4"/>
    <text x="687" y="467" font-size="20" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">destroy 전 확인</text>
    <text x="687" y="505" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">plan처럼 "무엇을 지울지" 목록을 먼저 보여준다</text>
    <text x="687" y="537" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" fill="#122033" xml:space="preserve" style="white-space:pre">Plan: 0 to add, 0 to change, N to destroy</text>
    <text x="687" y="577" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">skip_final_snapshot=true라 RDS도 그냥 삭제됨</text>
  </g>

  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 02 · AWS 실습</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">17</text>
</svg>
