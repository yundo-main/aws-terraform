<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="step1 네트워크 구성도">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/></marker>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker></defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
<text x="60" y="90" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">2단계 — terraform plan</text><text x="60" y="134" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">실제 변경 전에 실행하는 이유 3가지</text><rect x="60" y="165" width="640" height="330" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">왜 plan이 필요한가</text><text x="90" y="245" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">① 변경 영향도 사전 파악</text><text x="112" y="275" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">생성(+)·수정(~)·재생성(-/+)을 미리 확인 —</text><text x="112" y="300" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">DB·네트워크의 의도치 않은 삭제 방지</text><text x="90" y="335" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">② 드리프트 감지</text><text x="112" y="365" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">콘솔 수동 변경 등 tfstate와 실제 인프라의</text><text x="112" y="390" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">불일치를 비교해 동기화 계획을 세운다</text><text x="90" y="425" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">③ 문법·API 유효성 검증</text><text x="112" y="455" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">HCL 문법·AWS 인증·의존 그래프가</text><text x="112" y="480" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">배포 전에 정상 해결되는지 검증</text><rect x="730" y="165" width="490" height="160" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="760" y="200" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">기호</text><text x="870" y="200" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">의미</text><text x="760" y="228" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">+</text><text x="870" y="228" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">새로 생성 (create)</text><text x="760" y="254" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">~</text><text x="870" y="254" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">속성 변경 (update)</text><text x="760" y="280" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">-</text><text x="870" y="280" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">삭제 (destroy)</text><text x="760" y="306" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">-/+</text><text x="870" y="306" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">삭제 후 재생성 (replace)</text><rect x="730" y="345" width="490" height="150" rx="10" fill="#122033" stroke="#c9d5e1" stroke-width="1"/><text x="760" y="385" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">이 코드의 예상 출력</text><text x="760" y="420" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="18" font-weight="700" fill="#a7f3d0" xml:space="preserve" style="white-space:pre">Plan: N to add, 0 to change,</text><text x="760" y="450" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="18" font-weight="700" fill="#a7f3d0" xml:space="preserve" style="white-space:pre">      0 to destroy.</text><text x="760" y="480" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#7dd3fc" xml:space="preserve" style="white-space:pre">전 리소스가 +로 나열되는지 확인</text><rect x="60" y="525" width="1160" height="70" rx="10" fill="#fdf2e9" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="562" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">plan은 인프라를 바꾸지 않는다 — 읽기 전용. 안심하고 여러 번 돌려도 됩니다</text><rect x="60" y="615" width="1160" height="55" rx="10" fill="#e6f1fa" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="648" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#1769aa" xml:space="preserve" style="white-space:pre">"declared but not referenced" 에러 = 리소스 이름 불일치 — 코드부터 수정</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 02 · AWS 실습</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">10</text>
</svg>