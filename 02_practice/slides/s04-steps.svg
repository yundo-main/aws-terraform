ple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">네트워크</text><text x="479" y="314" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">VPC·서브넷·IGW·NGW·라우팅</text><text x="479" y="340" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">16개 리소스</text><line x1="820" y1="280" x2="850" y2="280" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="850" y="200" width="365" height="160" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="874" y="242" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="24" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">07~09</text><text x="874" y="280" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">컴퓨트</text><text x="874" y="314" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">SG·EC2·RDS</text><text x="874" y="340" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">6개 리소스</text><rect x="60" y="420" width="565" height="150" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="92" y="462" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">하나의 state</text><text x="92" y="502" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">참조가 연결 고리 —</text><text x="92" y="534" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">subnet_id = aws_subnet.x.id</text><rect x="655" y="420" width="565" height="150" rx="10" fill="#fdf6ec" stroke="#b86e00" stroke-width="2"/><text x="687" y="462" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">EKS·ALB는 어디로?</text><text x="687" y="502" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">03_real에서 같은 구조를</text><text x="687" y="534" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">변수화해 전체를 다룬다 (41개)</text><rect x="60" y="600" width="1160" height="60" rx="10" fill="#e6f1fa"/><text x="640" y="637" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">02는 네트워크+컴퓨트까지 — 03에서 EKS·ALB·도메인까지 확장된다</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 02 · AWS 실습</text>
