"700" fill="#1769aa" xml:space="preserve" style="white-space:pre">→</text><rect x="650" y="190" width="265" height="170" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="672" y="235" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">step3_eks</text><text x="672" y="275" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">EKS·노드그룹·ECR</text><text x="672" y="310" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">remote_state → step1</text><text x="920" y="290" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">→</text><rect x="945" y="190" width="265" height="170" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="967" y="235" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">step4_alb</text><text x="967" y="275" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">Route53·ACM·ALB</text><text x="967" y="310" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">작성 예정 (빈 파일)</text><rect x="60" y="400" width="1160" height="120" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="92" y="442" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">remote_state 연결</text><text x="92" y="482" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">data "terraform_remote_state" "network" — step1의 terraform.tfstate를 읽어</text><text x="92" y="512" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">local.vpc_id = data.terraform_remote_state.network.outputs.vpc_id</text><rect x="60" y="550" width="1160" height="60" rx="10" fill="#fdf6ec"/><text x="640" y="587" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#b86e00" xml:space="preserve" style="white-space:pre">apply는 step1→4 순서, destroy는 반드시 역순 (step4→1) — 참조가 깨지지 않게</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 02 · AWS 실습</text>
