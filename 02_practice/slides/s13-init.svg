<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="terraform init 실행과 결과">
  <defs>
    <marker id="ah1769aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>

  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">1단계 — terraform init</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">03_aws 디렉터리에서 가장 먼저 실행하는 명령</text>

  <!-- 명령어 -->
  <rect x="60" y="170" width="1160" height="64" rx="10" fill="#122033"/>
  <text x="92" y="211" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="22" fill="#ffffff" xml:space="preserve" style="white-space:pre">cd 03_aws &amp;&amp; terraform init</text>

  <!-- 흐름 -->
  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="60" y="290" width="320" height="130" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <text x="220" y="338" text-anchor="middle" font-size="19" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">.tf 파일 스캔</text>
    <text x="220" y="374" text-anchor="middle" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">required_providers 확인</text>

    <line x1="386" y1="355" x2="446" y2="355" stroke="#1769aa" stroke-width="3" marker-end="url(#ah1769aa)"/>

    <rect x="454" y="290" width="320" height="130" rx="10" fill="#ffffff" stroke="#1769aa" stroke-width="2"/>
    <text x="614" y="330" text-anchor="middle" font-size="19" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">Registry에서 다운로드</text>
    <text x="614" y="366" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" fill="#516174" xml:space="preserve" style="white-space:pre">hashicorp/aws ~&gt; 5.0</text>
    <text x="614" y="396" text-anchor="middle" font-size="15" fill="#516174" xml:space="preserve" style="white-space:pre">lock 파일에 해시 기록</text>

    <line x1="780" y1="355" x2="840" y2="355" stroke="#1769aa" stroke-width="3" marker-end="url(#ah1769aa)"/>

    <rect x="848" y="290" width="372" height="130" rx="10" fill="#ffffff" stroke="#1a7f4b" stroke-width="2"/>
    <text x="1034" y="330" text-anchor="middle" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="18" font-weight="700" fill="#1a7f4b" xml:space="preserve" style="white-space:pre">.terraform/ 생성</text>
    <text x="1034" y="366" text-anchor="middle" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">플러그인 설치 완료</text>
    <text x="1034" y="396" text-anchor="middle" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">"Terraform has been…"</text>
  </g>

  <!-- 언제 다시? -->
  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="60" y="470" width="1160" height="140" rx="10" fill="#e6f1fa"/>
    <text x="92" y="512" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">init을 다시 실행하는 경우</text>
    <text x="92" y="550" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">· 처음 clone/다운로드 받은 직후      · required_providers 추가·버전 변경 시</text>
    <text x="92" y="586" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">· .terraform/ 폴더를 지웠을 때      · backend 설정을 바꿨을 때</text>
  </g>

  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 02 · AWS 실습</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">13</text>
</svg>
