<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="실행 전 준비 체크리스트">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>

  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">실행 전 준비</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">apply 전에 확인해야 할 것들</text>

  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="60" y="170" width="565" height="150" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <text x="92" y="212" font-size="22" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">① Terraform CLI</text>
    <text x="92" y="250" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" fill="#122033" xml:space="preserve" style="white-space:pre">brew install terraform</text>
    <text x="92" y="282" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">terraform version  # 1.x 확인</text>

    <rect x="655" y="170" width="565" height="150" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <text x="687" y="212" font-size="22" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">② AWS 자격증명</text>
    <text x="687" y="250" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">~/.aws/credentials 또는 환경변수</text>
    <text x="687" y="282" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">aws sts get-caller-identity  # 확인</text>

    <rect x="60" y="350" width="565" height="150" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <text x="92" y="392" font-size="22" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">③ EC2 키페어</text>
    <text x="92" y="430" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">08-ec2.tf의 key_name = "ja-01"이</text>
    <text x="92" y="462" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">계정에 미리 생성돼 있어야 함</text>

    <rect x="655" y="350" width="565" height="150" rx="10" fill="#fdf6ec" stroke="#b86e00" stroke-width="2"/>
    <text x="687" y="392" font-size="22" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">④ 리소스 이름 확인 ⚠</text>
    <text x="687" y="430" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">참조하는 이름이 선언된 이름과 다르면</text>
    <text x="687" y="462" font-size="17" fill="#122033" xml:space="preserve" style="white-space:pre">plan 단계에서 에러로 멈춘다</text>
  </g>

  <rect x="60" y="540" width="1160" height="70" rx="10" fill="#e6f1fa"/>
  <text x="640" y="583" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" fill="#122033" xml:space="preserve" style="white-space:pre">자격증명·키페어가 갖춰지면 이제 명령어 4개만 알면 된다</text>

  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 02 · AWS 실습</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">02</text>
</svg>
