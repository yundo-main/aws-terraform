<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="생각해보기 정답과 해설">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>

  <text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">정답</text>
  <text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#516174" xml:space="preserve" style="white-space:pre">생각해보기 세 질문의 답과 해설</text>

  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <rect x="60" y="180" width="1160" height="130" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <rect x="60" y="180" width="6" height="130" rx="3" fill="#1a7f4b"/>
    <text x="92" y="218" font-size="19" font-weight="700" fill="#1a7f4b" xml:space="preserve" style="white-space:pre">1. init을 다시 실행하는 경우</text>
    <text x="92" y="254" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">프로바이더 추가·버전 변경, backend 변경, .terraform/ 삭제, 새로 clone 받은 직후</text>
    <text x="92" y="288" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">→ 플러그인·백엔드 등 "작업 환경"이 바뀔 때마다. 멱등이라 몇 번 해도 안전하다</text>

    <rect x="60" y="330" width="1160" height="130" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <rect x="60" y="330" width="6" height="130" rx="3" fill="#1a7f4b"/>
    <text x="92" y="368" font-size="19" font-weight="700" fill="#1a7f4b" xml:space="preserve" style="white-space:pre">2. plan 기호의 의미</text>
    <text x="92" y="404" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">+ 생성 · ~ 속성 변경 · - 삭제 · -/+ 삭제 후 재생성(replace)</text>
    <text x="92" y="438" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">→ -/+가 뜨면 재생성 사유(예: AMI·서브넷 변경)를 확인하고 apply 여부 결정</text>

    <rect x="60" y="480" width="1160" height="130" rx="10" fill="#ffffff" stroke="#c9d5e1"/>
    <rect x="60" y="480" width="6" height="130" rx="3" fill="#1a7f4b"/>
    <text x="92" y="518" font-size="19" font-weight="700" fill="#1a7f4b" xml:space="preserve" style="white-space:pre">3. destroy의 기준</text>
    <text x="92" y="554" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">.tf가 아니라 terraform.tfstate에 기록된 리소스 — state가 추적하는 것만 지운다</text>
    <text x="92" y="588" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">→ 콘솔에서 직접 만든 리소스는 state에 없으므로 destroy 대상이 아니다</text>
  </g>

  <text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 02 · AWS 실습</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">17</text>
</svg>
