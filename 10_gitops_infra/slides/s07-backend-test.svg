<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="10_gitops_infra 실습">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/></marker>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker></defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
<text x="60" y="90" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">10_gitops_infra 실습 — 저장소 계층 만들기</text><text x="60" y="134" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">버킷·잠금을 직접 만들고 outputs가 무엇을 노출하는지 확인</text><rect x="60" y="165" width="570" height="240" rx="10" fill="#122033" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="200" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">실행</text><text x="90" y="232" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#a7f3d0" xml:space="preserve" style="white-space:pre">cd 10_gitops_infra</text><text x="90" y="262" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#a7f3d0" xml:space="preserve" style="white-space:pre">terraform init &amp;&amp; terraform apply</text><text x="90" y="292" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#a7f3d0" xml:space="preserve" style="white-space:pre">terraform output backend_snippet</text><text x="90" y="322" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#a7f3d0" xml:space="preserve" style="white-space:pre">terraform output | grep bucket</text><text x="90" y="355" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="13" font-weight="400" fill="#7dd3fc" xml:space="preserve" style="white-space:pre"># backend_snippet를 03_real/versions.tf에 붙여넣기</text><rect x="660" y="165" width="560" height="240" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="690" y="200" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">테스트 — AWS CLI로 실제 확인</text><text x="690" y="238" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">aws s3 ls | grep tfstate          # 버킷 생성됨</text><text x="690" y="272" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">aws dynamodb list-tables          # lock 테이블</text><text x="690" y="306" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">aws s3api get-bucket-versioning   # 버저닝 ON</text><text x="690" y="340" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">terraform destroy → 입력 전 취소  # prevent_destroy</text><text x="690" y="375" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">→ destroy 거부 메시지가 보호 동작 증명</text><rect x="60" y="435" width="1160" height="120" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="473" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">확인 포인트</text><text x="90" y="508" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">① outputs가 찍히는가 — backend_snippet·버킷 이름 — 11이 remote_state로 읽을 값은 outputs로 노출됨</text><text x="90" y="540" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">② 버저닝이 켜졌는가 — state 이력 복구의 조건</text><rect x="60" y="585" width="1160" height="70" rx="10" fill="#fdf2e9" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="622" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">이 단계 리소스는 과금 거의 없음 — 버킷 요금 수준. 지워도 되지만 11이 참조하니 보통 끝까지 둠</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 10 · CI/CD</text>
