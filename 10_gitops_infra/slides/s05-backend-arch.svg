<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="저장소 구성도">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/></marker>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker></defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
<text x="60" y="90" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">저장소 구성도 — 왜 3개인가</text><text x="60" y="134" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">로컬 state로는 팀·CI가 공동 작업 불가 — 진실을 S3에 두고 잠금·산출물을 분리</text><rect x="60" y="165" width="365" height="175" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="80" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">S3 tfstate</text><text x="80" y="235" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">버저닝·암호화·공개차단·prevent_destroy</text><text x="80" y="268" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">state는 '내가 만든 것'의 유일한 장부 — 로컬 파일이면</text><text x="80" y="290" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">CodeBuild가 접근 못하고 팀원끼리 충돌. S3+버저닝으로</text><text x="80" y="312" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">이력·복구까지 확보. prevent_destroy = 실수로 지워도 안 지워짐</text><rect x="455" y="165" width="365" height="175" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="475" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">DynamoDB lock</text><text x="475" y="235" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">LockID 해시키 — 동시 apply 차단</text><text x="475" y="268" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">apply 2개가 동시에 돌면 state가 깨진다. plan 전에</text><text x="475" y="290" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">잠금을 잡아 하나만 진행시키는 뮤텍스 — CI는 특히</text><text x="475" y="312" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">push 연속 시 겹치기 쉬워서 필수</text><rect x="850" y="165" width="365" height="175" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="870" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">S3 artifacts</text><text x="870" y="235" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">파이프라인 단계 간 파일 전달</text><text x="870" y="268" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">plan 단계의 tfplan·소스를 apply 단계가 받는 통로.</text><text x="870" y="290" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">같은 파일을 넘겨야 '검토한 계획'과 '적용한 내용'이</text><text x="870" y="312" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">일치 — force_destroy는 실습용(정리 쉽게)</text><line x1="230" y1="340" x2="230" y2="380" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><line x1="620" y1="340" x2="620" y2="380" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="380" width="365" height="90" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="80" y="420" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">10_gitops_infra</text><text x="80" y="450" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">artifact 버킷·S3 backend를 remote_state로 참조</text><rect x="455" y="380" width="365" height="90" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="475" y="420" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">11_gitops_app</text><text x="475" y="450" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">같은 버킷 + 공용 IAM 역할까지 같은 state</text><rect x="850" y="165" width="370" height="305" rx="10" fill="#e6f1fa" stroke="#c9d5e1" stroke-width="1"/><text x="880" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">핵심 — outputs가 계약</text><text x="880" y="245" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">outputs 4개가</text><text x="880" y="272" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">11_gitops_app의 remote_state 입력</text><text x="880" y="312" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">버킷 이름을 코드에 박지 않고</text><text x="880" y="339" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">outputs로 전달 — 버킷 재생성</text><text x="880" y="366" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">해도 하위 step은 자동 추적</text><text x="880" y="410" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">destroy는 역순 (11→2→1)</text><text x="880" y="437" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">tfstate 버킷이 먼저 지워지면</text><text x="880" y="464" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">하위 state 관리 불가가 됨</text><rect x="60" y="600" width="1160" height="60" rx="10" fill="#fdf2e9" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="635" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">로컬 → S3 backend 전환은 03_real에서 실습 — terraform init -migrate-state</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 10 · CI/CD</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">05</text>
</svg>