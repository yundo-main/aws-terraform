<text x="60" y="90" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">왜 remote_state인가</text><text x="60" y="134" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">04는 별도 state — 03의 리소스를 직접 참조할 수 없다</text><rect x="60" y="165" width="570" height="260" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">같은 state (03 내부)</text><text x="90" y="245" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">alb_arn = aws_lb.app.arn</text><text x="90" y="280" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">직접 참조 — Terraform이 앎</text><text x="90" y="330" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">다른 state (04 → 03)</text><text x="90" y="370" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">alb_arn = local.real.alb_arn</text><text x="90" y="405" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">outputs만 읽을 수 있다</text><rect x="660" y="165" width="560" height="260" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="690" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">outputs = 공식 인터페이스</text><text x="690" y="245" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">다른 state의 리소스 속성은</text><text x="690" y="275" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">output으로 노출된 것만 읽힘</text><text x="690" y="320" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">03 outputs.tf에</text><text x="690" y="350" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">'04가 읽는 값' 섹션이 있는 이유</text><rect x="60" y="455" width="1160" height="100" rx="10" fill="#122033" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="495" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#7dd3fc" xml:space="preserve" style="white-space:pre">data "terraform_remote_state" "real" {</text><text x="90" y="525" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#a7f3d0" xml:space="preserve" style="white-space:pre">  backend = "local"  config = { path = "../03_real/terraform.tfstate" }</text><rect x="60" y="585" width="1160" height="70" rx="10" fill="#fdf2e9" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="622" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">03 미적용·outputs 없으면 plan 단계에서 즉시 실패 — 선행 조건이 코드에 박혀 있음</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 04 · HTTPS 확장</text>
