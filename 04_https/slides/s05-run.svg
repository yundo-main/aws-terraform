<text x="60" y="90" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">실행과 검증</text><text x="60" y="134" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">03 apply → NS 위임 → 04 apply → https 접속</text><rect x="60" y="165" width="1160" height="240" rx="10" fill="#122033" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="205" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" font-weight="400" fill="#a7f3d0" xml:space="preserve" style="white-space:pre">cd ../03_real &amp;&amp; terraform apply</text><text x="90" y="240" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" font-weight="400" fill="#a7f3d0" xml:space="preserve" style="white-space:pre">terraform output route53_name_servers</text><text x="90" y="275" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#7dd3fc" xml:space="preserve" style="white-space:pre"># → 등록기관에 NS 4개 수동 등록 (Terraform 밖의 유일한 단계)</text><text x="90" y="320" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" font-weight="400" fill="#a7f3d0" xml:space="preserve" style="white-space:pre">cd ../04_https &amp;&amp; terraform init &amp;&amp; terraform apply</text><text x="90" y="355" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="17" font-weight="400" fill="#a7f3d0" xml:space="preserve" style="white-space:pre">terraform output https_url</text><rect x="60" y="435" width="570" height="140" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="473" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">검증</text><text x="90" y="508" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">nslookup app.&lt;도메인&gt; → ALB DNS</text><text x="90" y="538" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">Route53 콘솔 — _해시 CNAME 자동 생성 확인</text><rect x="660" y="435" width="560" height="140" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="690" y="473" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">정리</text><text x="690" y="508" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">terraform destroy — 인증서·리스너만 삭제</text><text x="690" y="538" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">03의 ALB·존은 그대로 남는다</text><rect x="60" y="595" width="1160" height="85" rx="12" fill="#fde8e8" stroke="#c0392b" stroke-width="3"/><text x="640" y="632" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="24" font-weight="700" fill="#c0392b" xml:space="preserve" style="white-space:pre">⚠ apply가 멈춰있으면 — NS 위임 미완료가 원인 1위</text><text x="640" y="665" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="600" fill="#8e2010" xml:space="preserve" style="white-space:pre">레코드는 있는데 존에 쿼리가 도달 못함 → 검증 무한 대기</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 04 · HTTPS 확장</text>
