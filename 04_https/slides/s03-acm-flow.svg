<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="04 ACM 흐름 슬라이드">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/></marker>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker></defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
<text x="60" y="90" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">ACM 발급 흐름 — 의존 그래프가 순서</text><text x="60" y="134" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">depends_on 없이 참조만으로 cert → record → 검증 순서가 보장된다</text><rect x="60" y="170" width="280" height="120" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="84" y="220" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">① 인증서 요청</text><text x="84" y="255" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">acm_certificate</text><line x1="340" y1="230" x2="420" y2="230" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="420" y="170" width="280" height="120" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="444" y="220" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">② 검증 레코드</text><text x="444" y="255" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">route53_record</text><line x1="700" y1="230" x2="780" y2="230" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="780" y="170" width="440" height="120" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="804" y="220" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">③ 검증 대기</text><text x="804" y="255" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">acm_certificate_validation</text><rect x="60" y="330" width="1160" height="120" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="370" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">CNAME 값은 인증서 요청의 결과물 — 레코드가 먼저 올 수 없다</text><text x="90" y="405" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">domain_validation_options의 name/value를 for_each로 그대로 레코드 생성 —</text><text x="90" y="432" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">콘솔에서 CNAME 복사할 필요 없이 apply 한 번에 발급 완료</text><rect x="60" y="478" width="1160" height="135" rx="12" fill="#fde8e8" stroke="#c0392b" stroke-width="3"/><text x="640" y="528" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="30" font-weight="700" fill="#c0392b" xml:space="preserve" style="white-space:pre">⚠ NS 위임 전이면 검증이 끝나지 않습니다</text><text x="640" y="575" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="600" fill="#8e2010" xml:space="preserve" style="white-space:pre">레코드는 만들어져도 존에 쿼리가 도달 못해 apply가 무한 대기</text><rect x="60" y="632" width="1160" height="45" rx="10" fill="#e6f1fa" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="661" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">create_before_destroy — 재발급 시 새 인증서 먼저 발급 후 교체 (다운타임 방지)</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 04 · HTTPS 확장</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">03</text>
</svg>