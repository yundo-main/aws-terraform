<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="04 부착 패턴 슬라이드">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/></marker>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker></defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
<text x="60" y="90" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">부착 패턴 — 03을 수정하지 않고 확장</text><text x="60" y="134" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">state가 다르면 리소스를 고칠 수 없다 — 규칙·리스너를 새 리소스로 얹는다</text><rect x="60" y="165" width="570" height="240" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">SG에 규칙 추가</text><text x="90" y="245" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">aws_security_group_rule "alb_https"</text><text x="90" y="280" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">SG 소유 = 03 · 규칙 소유 = 04</text><text x="90" y="310" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">04 destroy → 규칙만 사라짐</text><rect x="660" y="165" width="560" height="240" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="690" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">ALB에 리스너 추가</text><text x="690" y="245" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">aws_lb_listener "https"</text><text x="690" y="280" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">ALB 소유 = 03 · 리스너 소유 = 04</text><text x="690" y="310" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">80 리스너는 그대로 공존</text><rect x="60" y="435" width="1160" height="110" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="473" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">state 경계의 의미</text><text x="90" y="508" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">다른 state의 리소스는 읽기만 가능 — 03의 80 리스너를 리다이렉트로</text><text x="90" y="535" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">바꾸려면 03의 코드를 직접 수정해야 한다 (04에서는 불가)</text><rect x="60" y="575" width="1160" height="80" rx="10" fill="#e6f1fa" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="612" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">domain_enabled = 거짓이면 이 단계 리소스 전부 count=0 — 빈 plan</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 04 · HTTPS 확장</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">04</text>
</svg>