<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="앱 배포 흐름">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/></marker>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker></defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect width="1280" height="10" fill="#1769aa"/>
<text x="60" y="90" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">앱 배포 파이프라인 — 이미지가 노드에 도달하는 길</text><text x="60" y="134" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">인프라 파이프라인과 별개 수명주기 — 앱은 인프라보다 훨씬 자주 바뀐다</text><rect x="60" y="165" width="280" height="135" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="78" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">앱 push</text><text x="78" y="232" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">dev 브랜치 — Dockerfile·k8s 매니페스트</text><text x="78" y="262" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">인프라와 같은 리포·다른 브랜치 — 배포 주기가 달라 분리</text><line x1="340" y1="232" x2="358" y2="232" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="360" y="165" width="280" height="135" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="378" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">Build — CodeBuild</text><text x="378" y="232" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">docker build → ECR push</text><text x="378" y="262" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">tag = 커밋 해시 8자리 — '어떤 코드가 떠있는지' 역추적 가능</text><line x1="640" y1="232" x2="658" y2="232" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="660" y="165" width="280" height="135" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="678" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">Deploy — CodeBuild</text><text x="678" y="232" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">kubectl apply + set image</text><text x="678" y="262" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">imageDetail.json으로 빌드된 정확한 태그를 배포</text><line x1="940" y1="232" x2="958" y2="232" stroke="#1769aa" stroke-width="2.5" marker-end="url(#ar)"/><rect x="960" y="165" width="280" height="135" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="978" y="205" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">Serve — EKS</text><text x="978" y="232" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="600" fill="#b86e00" xml:space="preserve" style="white-space:pre">pod 2개 + Service</text><text x="978" y="262" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">노드그룹에서 롤링 — imagePullPolicy로 새 태그 풀</text><rect x="60" y="330" width="570" height="140" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="368" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">imageDetail.json — 빌드→배포 다리</text><text x="90" y="402" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">빌드가 쓴 이미지 URI를 배포 단계가 읽는 artifact</text><text x="90" y="430" text-anchor="start" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="13" font-weight="400" fill="#122033" xml:space="preserve" style="white-space:pre">{"image": ".../app:abc12345"}</text><text x="90" y="458" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">태그를 고정 안 하면 최신이 아닌 것을 배포할 수 있음</text><rect x="660" y="330" width="560" height="140" rx="10" fill="#fdf2e9" stroke="#c9d5e1" stroke-width="1"/><text x="690" y="368" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">전제 — aws-auth 등록 필수</text><text x="690" y="402" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">EKS 클러스터 + aws-auth ConfigMap에</text><text x="690" y="430" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13.5" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">CodeBuild 역할을 mapRoles로 등록</text><text x="690" y="458" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13.5" font-weight="700" fill="#b86e00" xml:space="preserve" style="white-space:pre">없으면 deploy에서 kubectl 인증 실패</text><rect x="60" y="500" width="1160" height="80" rx="10" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="538" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#122033" xml:space="preserve" style="white-space:pre">왜 파이프라인을 2개로 나누는가</text><text x="90" y="570" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#516174" xml:space="preserve" style="white-space:pre">인프라(.tf)는 드물게·신중히, 앱(이미지)은 자주·빠르게 — 수명주기가 다르면 state도 파이프라인도 분리</text><rect x="60" y="605" width="1160" height="60" rx="10" fill="#e6f1fa" stroke="#c9d5e1" stroke-width="1"/><text x="90" y="640" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1769aa" xml:space="preserve" style="white-space:pre">인프라 파이프라인 + 앱 파이프라인 = 완전한 GitOps — push가 곧 배포</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#516174" xml:space="preserve" style="white-space:pre">Terraform · 11 · CODECOMMIT</text>
  <text x="1220" y="700" text-anchor="end" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" xml:space="preserve" style="white-space:pre">03</text>
</svg>